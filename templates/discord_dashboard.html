<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord → Robinhood Copy Trader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-lg font-bold tracking-tight">Discord → Robinhood Copy Trader</h1>
    <div class="flex items-center gap-4">
      <span id="configured-badge" class="text-xs font-medium px-2.5 py-1 rounded-full
        {{ 'bg-green-900 text-green-300' if configured else 'bg-red-900 text-red-300' }}">
        {{ 'Configured' if configured else 'Not Configured' }}
      </span>
      <span id="live-badge" class="text-xs font-medium px-2.5 py-1 rounded-full
        {{ 'bg-red-900 text-red-300' if live_trading else 'bg-gray-800 text-gray-400' }}">
        {{ 'LIVE TRADING' if live_trading else 'Dry Run' }}
      </span>
      <a href="/settings" class="text-sm text-gray-500 hover:text-gray-300 transition-colors">Settings</a>
      <a href="/logout" class="text-sm text-gray-500 hover:text-gray-300 transition-colors">Logout</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-6 space-y-6">

    <!-- Controls -->
    <section class="bg-gray-900 rounded-xl border border-gray-800 p-5 flex flex-wrap items-center gap-6">
      <!-- Running status -->
      <div class="flex items-center gap-3">
        <span id="status-dot" class="w-3 h-3 rounded-full {{ 'bg-green-400' if running else 'bg-gray-600' }}"></span>
        <span id="status-label" class="text-sm font-medium {{ 'text-green-300' if running else 'text-gray-400' }}">
          {{ 'Running' if running else 'Stopped' }}
        </span>
      </div>
      <div class="flex gap-2">
        <button id="btn-start"
          onclick="controlTrader('start')"
          class="px-4 py-1.5 text-sm rounded-lg bg-green-700 hover:bg-green-600 text-white
                 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
          {{ 'disabled' if running or not configured }}>
          Start
        </button>
        <button id="btn-stop"
          onclick="controlTrader('stop')"
          class="px-4 py-1.5 text-sm rounded-lg bg-red-700 hover:bg-red-600 text-white
                 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
          {{ 'disabled' if not running }}>
          Stop
        </button>
      </div>

      <!-- Divider -->
      <div class="h-8 w-px bg-gray-700"></div>

      <!-- Pause / Resume -->
      <div class="flex items-center gap-3">
        <span id="pause-dot" class="w-3 h-3 rounded-full bg-gray-600"></span>
        <span id="pause-label" class="text-sm font-medium text-gray-400">Active</span>
      </div>
      <div class="flex gap-2">
        <button id="btn-pause"
          onclick="controlTrader('pause')"
          class="px-4 py-1.5 text-sm rounded-lg bg-yellow-700 hover:bg-yellow-600 text-white transition-colors">
          Pause
        </button>
        <button id="btn-resume"
          onclick="controlTrader('resume')"
          class="px-4 py-1.5 text-sm rounded-lg bg-blue-700 hover:bg-blue-600 text-white transition-colors">
          Resume
        </button>
      </div>
    </section>

    <!-- Activity Log -->
    <section class="bg-gray-900 rounded-xl border border-gray-800 p-5">
      <h2 class="text-sm font-semibold text-gray-300 mb-3 uppercase tracking-wide">Activity Log</h2>
      <div id="log-container"
           class="font-mono text-xs space-y-0.5 max-h-[32rem] overflow-y-auto">
        <p class="text-gray-500">Loading…</p>
      </div>
    </section>

  </main>

  <script>
    async function controlTrader(action) {
      await fetch(`/api/${action}`, { method: 'POST' });
      refreshStatus();
    }

    async function refreshStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();

      const configuredBadge = document.getElementById('configured-badge');
      configuredBadge.textContent = data.configured ? 'Configured' : 'Not Configured';
      configuredBadge.className = `text-xs font-medium px-2.5 py-1 rounded-full ${
        data.configured ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'
      }`;

      const liveBadge = document.getElementById('live-badge');
      liveBadge.textContent = data.live_trading ? 'LIVE TRADING' : 'Dry Run';
      liveBadge.className = `text-xs font-medium px-2.5 py-1 rounded-full ${
        data.live_trading ? 'bg-red-900 text-red-300' : 'bg-gray-800 text-gray-400'
      }`;

      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.className = `w-3 h-3 rounded-full ${data.running ? 'bg-green-400' : 'bg-gray-600'}`;
      label.textContent = data.running ? 'Running' : 'Stopped';
      label.className = `text-sm font-medium ${data.running ? 'text-green-300' : 'text-gray-400'}`;

      const pauseDot = document.getElementById('pause-dot');
      const pauseLabel = document.getElementById('pause-label');
      pauseDot.className = `w-3 h-3 rounded-full ${data.paused ? 'bg-yellow-400' : 'bg-green-400'}`;
      pauseLabel.textContent = data.paused ? 'Paused' : 'Active';
      pauseLabel.className = `text-sm font-medium ${data.paused ? 'text-yellow-300' : 'text-green-300'}`;

      document.getElementById('btn-start').disabled = data.running || !data.configured;
      document.getElementById('btn-stop').disabled = !data.running;

      renderLog(data.log);
    }

    function renderLog(entries) {
      const container = document.getElementById('log-container');
      if (!entries || entries.length === 0) {
        container.innerHTML = '<p class="text-gray-500">No activity yet.</p>';
        return;
      }
      const colours = { INFO: 'text-gray-300', WARNING: 'text-yellow-400', ERROR: 'text-red-400' };
      container.innerHTML = [...entries].reverse().map(e => `
        <div class="flex gap-2">
          <span class="text-gray-600 shrink-0">${e.time}</span>
          <span class="${colours[e.level] || 'text-gray-300'}">${escHtml(e.message)}</span>
        </div>
      `).join('');
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
