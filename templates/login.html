<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Trader — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">Schwab Copy Trader</h1>
      <p class="text-gray-400 text-sm mt-1">Enter your dashboard password to continue</p>
    </div>
    <form method="post" class="bg-gray-900 rounded-xl p-8 shadow-lg border border-gray-800">
      {% if error %}
        <p class="text-red-400 text-sm mb-4 text-center">{{ error }}</p>
      {% endif %}
      <label class="block text-sm text-gray-400 mb-1">Password</label>
      <input
        type="password"
        name="password"
        autofocus
        class="w-full bg-gray-800 text-white rounded-lg px-4 py-2.5 mb-5
               border border-gray-700 focus:outline-none focus:border-blue-500"
      >
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium
               rounded-lg py-2.5 transition-colors"
      >
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
